apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgateway
  namespace: kgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kgateway
  template:
    metadata:
      labels:
        app: kgateway
    spec:
      containers:
        - name: kgateway
          image: ghcr.io/kgateway-dev/kgateway:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kgateway
  namespace: kgateway
spec:
  selector:
    app: kgateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP